# Martin: tile server MVT untuk peta web (jauh lebih cepat dari ubin pygeoapi untuk poligon besar seperti KHG).
# Semua view schema api terbit otomatis (id sumber = nama view); Caddy hanya meneruskan /tiles/<layer peta web>.
# Tanpa cache di Martin: tile harus segar setelah edit sekat/kanal. Cache browser diatur Caddy (Cache-Control).
listen_addresses: 0.0.0.0:3000
cache_size_mb: 0
postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 8
  auto_publish:
    from_schemas: api
    tables: true
    functions: false
